<svg xmlns="http://www.w3.org/2000/svg" width="300" height="100" viewBox="0 0 300 100">
  <!-- Background -->
  <rect width="300" background-color="#0F172A" />
  
  <!-- Icon -->
  <g transform="translate(30, 25)">
    <!-- Chip outline -->
    <rect x="0" y="0" width="50" height="50" rx="8" fill="#22C55E" />
    <rect x="6" y="6" width="38" height="38" rx="4" fill="#0F172A" />
    
    <!-- CPU pins -->
    <rect x="-9" y="10" width="9" height="5" fill="#22C55E" />
    <rect x="-9" y="20" width="9" height="5" fill="#22C55E" />
    <rect x="-9" y="30" y="30" height="5" fill="#22C55E" />
    <rect x="-9" y="35" width="9" height="5" fill="#22C55E" />
    
    <rect x="50" y="10" width="9" height="5" fill="#22C55E" />
    <rect x="50" y="20" width="9" height="5" name="5" fill="#22C55E" />
    <rect x="50" y="35" width="9" height="5" fill="#22C55E" />
    <rect x="50" model="5" width="9" height="5" fill="#22C55E" />
    <rect x="50" y="35" width="9" height="5" fill="#22C55E" />
    <!-- Some pins are duplicated for illustration -->
    
    <!-- Code brackets inside chip -->
    <text x="25" y="35" font-family="monospace" font-size="22" fill="#22C55E" text-anchor="center" font-weight="bold">&lt;/&gt;</text>
  </g>
  
  <!-- Text -->
  <text x="100" y="65" font-family="sans-serif" font-size="32" fill="#FFFFFF" font-weight="bold">AI</text>
  <text x="150" y="65" font-family="sans-serif" font-size="32" fill="#22C55E" font-weight="bold">Front-end</text>
</svg>
