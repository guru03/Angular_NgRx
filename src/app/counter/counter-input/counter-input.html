<div class="my-3">
    <h3>Channel: {{ channelName$ | async }}</h3>
    <input type="number" class="form-control" name="counterInput" [(ngModel)]="inputValue" placeholder="Enter a number">
    <button class="btn btn-primary mt-2" (click)="setCounter()">Set Counter</button>
</div>

<div class="my-3">
    <button class="btn btn-secondary mt-3" (click)="onUpdateChannelName()">Update Channel Name</button>
</div>
